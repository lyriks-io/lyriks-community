# Every commit of a pull request carries a Developer Certificate of Origin
# sign-off (`git commit -s`), as CONTRIBUTING.md asks.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by: .* <.*@.*>'; then
              echo "::error::commit $sha has no Signed-off-by line (git commit -s)"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ]
